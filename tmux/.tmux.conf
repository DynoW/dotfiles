# ---------------------------------------------------------
# General & Performance
# ---------------------------------------------------------

# Recommended for Neovim (10ms is safe for SSH connections)
set -sg escape-time 10

# Increase scrollback history limit
set -g history-limit 50000

# Terminal type inside tmux
set -g default-terminal "tmux-256color"

# Pass true-color (RGB) and styled underlines (undercurl) through Ghostty / SSH
set -as terminal-features ",xterm*:RGB:usstyle"

# Enable focus events for Neovim focus tracking
set -g focus-events on

# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1 (matches keyboard row)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload config shortcut
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"

# ---------------------------------------------------------
# Keybindings & Navigation
# ---------------------------------------------------------

# Change prefix to Ctrl + Space (and free Ctrl + b)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Intuitive splits preserving current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window preserving current path
bind c new-window -c "#{pane_current_path}"

# Vi-style pane navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resizing (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------
# Copy Mode & Clipboard (SSH-friendly)
# ---------------------------------------------------------

# Use Vi keybindings in copy mode
setw -g mode-keys vi

# Pass copied text to system clipboard via OSC 52 (works over SSH into Ghostty)
set -s set-clipboard on

# Vim-like selection and copy shortcuts (Prefix + [ to enter copy mode)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Prevent jump to bottom when selecting with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# ---------------------------------------------------------
# vim-tmux-navigator (Ctrl + hjkl seamless navigation)
# ---------------------------------------------------------

# Pass Ctrl+hjkl to Neovim if active, otherwise switch tmux pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# ---------------------------------------------------------
# Status Bar Styling
# ---------------------------------------------------------

# Status bar transparent background
set -g status-style bg=default,fg=colour244

# Left: Session name
set -g status-left-length 40
set -g status-left "#[bold]#[fg=colour39]#S #[default]│ "

# Right: Time and date
set -g status-right "#[fg=colour244]%H:%M #[fg=colour240]• #[fg=colour244]%d-%b-%y"

# Window tabs: Dim inactive tabs, highlight active tab
setw -g window-status-style fg=colour240
setw -g window-status-current-style fg=colour39,bold
setw -g window-status-current-format "#I:#W*"
setw -g window-status-format "#I:#W"
